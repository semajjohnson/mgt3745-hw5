<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Pool</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>The Pool</h1>
    <p class="lede">Music that reached you through a person, kept with the person attached.</p>

    <form id="pool-form" novalidate>
      <div class="field">
        <label for="track-input">Track</label>
        <p id="track-help" class="help">Artist and title, 1 to 200 characters.</p>
        <input id="track-input" name="track" type="text" aria-describedby="track-help form-error" autocomplete="off">
      </div>
      <div class="field">
        <label for="source-input">Who it came from</label>
        <p id="source-help" class="help">A person's name, 1 to 60 characters. Required.</p>
        <input id="source-input" name="source" type="text" aria-describedby="source-help form-error" autocomplete="off">
      </div>
      <button type="submit">Add to pool</button>
      <p id="form-error" role="alert"></p>
    </form>

    <p id="save-status" role="status" aria-live="polite"></p>

    <section id="filter-section" hidden aria-label="Filter pool by mood label">
      <h2>Filter by label</h2>
      <div id="filter-buttons" role="group" aria-label="Mood label filters"></div>
    </section>

    <p id="active-filter-display" hidden role="status" aria-live="polite">
      Filtering by: <span id="active-filter-label"></span>
      <button type="button" id="clear-filter">Clear filter</button>
    </p>

    <h2>Pool</h2>
    <p id="empty-state">Nothing in the pool yet.</p>
    <ul id="pool-list" aria-label="Pool items"></ul>
  </main>
</body>
</html>
